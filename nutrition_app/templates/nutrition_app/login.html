{% extends 'nutrition_app/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="nutri-card">
                <div class="card-header-custom text-center">
                    <h2 class="mb-0"><i class="bi bi-person me-2"></i>Вход в систему</h2>
                </div>
                <div class="card-body p-4">
                    <!-- 🔥 БЛОК СООБЩЕНИЙ ОБ ОШИБКАХ -->
                    {% if messages %}
                    <div class="alert-container mb-4">
                        {% for message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" id="username" name="username" 
                                   class="form-control" 
                                   value="{{ username|default:'' }}"
                                   placeholder="Введите ваш логин" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" id="password" name="password" 
                                   class="form-control" 
                                   placeholder="Введите ваш пароль" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-nutri-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">
                            Нет аккаунта? 
                            <a href="{% url 'register' %}" class="text-success fw-bold">Зарегистрируйтесь</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
